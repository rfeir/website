<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>State Choropleth</title>
    
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="velmapper_favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="velmapper_favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="velmapper_favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="velmapper_favicon/apple-touch-icon.png">
  <link rel="manifest" href="velmapper_favicon/site.webmanifest">
  <meta name="theme-color" content="#5ccbb2">

  <style>
    body { font-family: sans-serif; margin: 0; padding: 1rem; text-align: center; }
    svg { max-width: 100%; height: auto; }
    .controls { margin-bottom: 1rem; flex-wrap: wrap; }

    input[type="color"] { margin: 0 .5rem; }

    .legend {
      display: inline-flex;
      align-items: center;
      margin: 1rem auto;
      width: 240px;
      height: 20px;
      background: linear-gradient(
        to right,
        var(--low-color) 0%,
        var(--mid-color) 50%,
        var(--high-color) 100%
      );
      border: 1px solid #aaa;
      position: relative;
    }

    .legend-label {
      font-size: 0.8rem;
      position: absolute;
      top: 24px;
      color: #333;
    }

    #tooltip {
      position: fixed;
      padding: 4px 8px;
      background: rgba(0,0,0,0.75);
      color: white;
      font-size: 0.8rem;
      border-radius: 4px;
      pointer-events: none;
      visibility: hidden;
      z-index: 1000;
    }

    button { margin: 0.2rem; }
  </style>
</head>

<body>

  <h2>Velmapper</h2>

  <div class="controls">

    <!-- SCALE MODE -->
    <label>Scale Mode:
      <select id="scaleMode">
        <option value="prebuilt" selected>Prebuilt Scale</option>
        <option value="custom">Custom 2-Color</option>
      </select>
    </label>

    <label>Min:
      <input type="number" id="manualMin" style="width:80px;">
    </label>
    
    <label>Max:
      <input type="number" id="manualMax" style="width:80px;">
    </label>
    
    <button id="applyMinMax">Apply Range</button>

    <label>White Text Percentile:
      <input type="number" id="whiteThreshold"
             value="87" min="0" max="100"
             step="1" style="width:60px;">
    </label>
    
    <!-- PREBUILT SCALES -->
    <label>Prebuilt:
      <select id="prebuiltScale">
        <option value="ndsuEmrld" selected>NDSU Emerald</option>
        <option value="ndsuGold" selected>NDSU Gold</option>
        <option value="ndsuBlue" selected>NDSU Blue</option>
        <option value="academicGray" selected>Academic Gray</option>
        <option value="viridis">Viridis</option>
        <option value="cividis">Cividis</option>
      </select>
    </label>

    <!-- CUSTOM COLORS (Only used if Custom selected) -->
    <label>Low:
      <input type="color" id="lowColor" value="#E8F5F1" />
    </label>

    <label>High:
      <input type="color" id="highColor" value="#0A5640" />
    </label>

    <label>Dark Text:
      <input type="color" id="darkTextColor" value="">
    </label>

    <!-- BORDER -->
    <label>Border Stroke (pt):
      <input type="number" id="borderWidth" value="0.5" step="0.1" min="0" style="width:60px;">
      <button id="applyBorder">Apply</button>
    </label>

    <label>Border Color:
      <input type="color" id="borderColor" value="#000000">
    </label>
    
    <!-- DATA -->
    <input type="file" id="csvFile" accept=".csv,.xlsx,.xls" />
    <button id="updateMap">Update Map</button>

    <!-- EXPORT -->
    <button id="downloadSVG">Download SVG</button>
    <button id="downloadPNG">Download PNG</button>
    <button id="downloadPDF">Download PDF</button>

    <!-- LABEL CONTROLS -->
    <label>Font:
      <select id="fontSelect">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier New</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Calibri">Calibri</option>
      </select>
    </label>

    <label>Size:
      <input type="number" id="fontSize" value="12" min="6" max="40" step="0.5" style="width:60px;">
    </label>

    <label>Value Format:
      <select id="valueFormat">
        <option value="number">Raw Number</option>
        <option value="integer">Integer</option>
        <option value="percent">Percent</option>
        <option value="currency">$ Currency</option>
        <option value="none">No Value</option>
      </select>
    </label>

    <label>Decimals:
      <input type="number" id="decimalPlaces" value="0" min="0" max="6" step="1" style="width:60px;">
    </label>

  </div>

  <div id="legendContainer"></div>

  <object id="usMap"
          type="image/svg+xml"
          data="state1.svg"
          style="width:90vw; height:70vh;">
  </object>

  <div id="tooltip"></div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.1/dist/svg2pdf.min.js"></script>

  <!-- Your main JS -->
  <script src="script.js"></script>

</body>
</html>
